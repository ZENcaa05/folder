<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>z</title>
    <link rel="stylesheet" href="tampilan.css">
</head>

<body>
    <header>
        <h1>SMART HOME</h1>
    </header>

    <div class="container">
        <!-- Identitas -->
        <div class="card identity">
            <p><strong>Nama:</strong> Muhammad Adhnan Hermawan</p>
            <p><strong>Kelas:</strong> XII-K2</p>
        </div>

        <!-- Kontrol Lampu dan Servo -->
        <div class="card control">
            <div class="control-section">
                <h3>Kontrol Lampu</h3>
                <div class="lamp-controls">
                    <button class="btn lamp-red" id="btn-merah" onclick="toggleLED('merah')">🔴</button>
                    <button class="btn lamp-green" id="btn-hijau" onclick="toggleLED('hijau')">🟢</button>
                    <button class="btn lamp-blue" id="btn-biru" onclick="toggleLED('biru')">🔵</button>
                    <button class="all-btn" id="all-lamps">All On/Off</button>
                </div>
            </div>
            <div class="control-section">
                <h3>Kontrol Kunci Pintu</h3>
                <div class="servo-controls">
                    <button class="btn servo-btn" id="servo-left">🔓</button>
                    <input type="range" class="slider" id="servo-slider" min="0" max="180" value=
                        oninput="updateServo(this.value)" disabled>
                    <span id="servoValue">0°</span>
                    <button class="btn servo-btn" id="servo-right">🔒</button>
                </div>
            </div>
        </div>

        <!-- Monitoring Sensor -->
        <div class="card monitoring">
            <h3>Monitoring Suhu & Kelembapan Kamar</h3>
            <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                <div>
                    <p>Suhu</p>
                    <div class="gauge" id="temp-gauge">
                        <span class="gauge-value" id="suhu">25°C</span>
                    </div>
                </div>
                <div>
                    <p>Kelembaban</p>
                    <div class="gauge" id="humidity-gauge">
                        <span class="gauge-value" id="kelembaban">60%</span>
                    </div>
                </div>
            </div>
            <button class="refresh-btn" id="refresh-btn">🔄 Refresh Data</button>
        </div>
    </div>

    <footer>
        <p> Versi 1.0 | <button
                style="background: none; border: none; color: white; cursor: pointer;">Reset</button></p>
    </footer>

    <!-- JQUERY -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyCFtAlvVdJJN2xAiIk0GUH0C6W2KOXsf-w",
            databaseURL: "https://uji-kompetensi-11709-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();

        /* SENSOR */
        db.ref('sensor/suhu').on('value', function(s) {
            $('#suhu').text(s.val() + '°C');
        });
        db.ref('sensor/kelembaban').on('value', function(s) {
            $('#kelembaban').text(s.val() + '%');
        });

        /* LAMPU */
        function toggleLED(warna) {
            var ref = db.ref('led/' + warna);
            ref.once('value').then(function(s) {
                ref.set(!s.val());
            });
        }

        $.each(['merah', 'biru', 'hijau'], function(i, w) {
            db.ref('led/' + w).on('value', function(s) {
                var $btn = $('#btn-' + w);
                $btn.text(s.val() ? 'OFF' : 'ON');
                $btn.css('opacity', s.val() ? 1 : 0.7);
                $btn.toggleClass('active', s.val());
            });
        });

        /* SERVO */
        function updateServo(v) {
            $('#servoValue').text(v + '°');
            db.ref('servo/sudut').set(parseInt(v));
        }
        db.ref('servo/sudut').on('value', function(s) {
            $('#servoValue').text(s.val() + '°');
            $('#servo-slider').val(s.val());
        });

        /* NAVIGASI (Opsional, jika ada menu) */
        function showPage(id, el) {
            $('main section').hide();
            $('#' + id).show();
            $('.menu a').removeClass('active');
            $(el).addClass('active');
        }

        /* ALL ON/OFF */
        var allOn = false;
        $('#all-lamps').on('click', function() {
            allOn = !allOn;
            $.each(['merah', 'biru', 'hijau'], function(i, w) {
                db.ref('led/' + w).set(allOn);
            });
            $(this).text(allOn ? 'All Off' : 'All On');
        });

        /* SERVO BUTTONS */
        $('#servo-left').on('click', function() {
            var $slider = $('#servo-slider');
            var newVal = Math.max(0, parseInt($slider.val()) - 180);
            $slider.val(newVal);
            updateServo(newVal);
        });

        $('#servo-right').on('click', function() {
            var $slider = $('#servo-slider');
            var newVal = Math.min(180, parseInt($slider.val()) + 180);
            $slider.val(newVal);
            updateServo(newVal);
        });

        /* REFRESH BUTTON */
        $('#refresh-btn').on('click', function() {
            console.log('Data refreshed');
        });
    </script>
</body>

</html>
